name: TalkHint
configs:
  Debug: debug
  Release: release
  NativeValidation: debug
  ChatPreview: debug
  ChatLiveDev: debug
options:
  bundleIdPrefix: app.talkhint
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 6G9ZS426J3
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
  configs:
    NativeValidation:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG TALKHINT_NATIVE_VALIDATION"
    ChatPreview:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG TALKHINT_CHAT_PREVIEW"
    ChatLiveDev:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG TALKHINT_CHAT_LIVE_DEV"
packages:
  TwilioVoice:
    url: https://github.com/twilio/twilio-voice-ios
    from: "6.11.0"
targets:
  TalkHint:
    type: application
    platform: iOS
    sources:
      - path: TalkHint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.talkhint
        PRODUCT_NAME: TalkHint
        INFOPLIST_FILE: TalkHint/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: TalkHint/TalkHint.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
        SWIFT_OBJC_BRIDGING_HEADER: TalkHint/TalkHint-Bridging-Header.h
      configs:
        ChatLiveDev:
          PRODUCT_BUNDLE_IDENTIFIER: app.talkhint.chatdev
          PRODUCT_NAME: TalkHintChatDev
    dependencies:
      - package: TwilioVoice
        product: TwilioVoice
  TalkHintTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TalkHintTests
    dependencies:
      - target: TalkHint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.talkhint.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TalkHint.app/TalkHint"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  TalkHintChatLiveDev:
    build:
      targets:
        TalkHint: all
    run:
      config: ChatLiveDev
      environmentVariables:
        TALKHINT_API_BASE_URL: https://e62acc35-f5e5-43be-91ea-c3ad7b36be85-00-3l7jbsd7n4zci.janeway.replit.dev
  TalkHintChatPreview:
    build:
      targets:
        TalkHint: all
    run:
      config: ChatPreview
  TalkHintValidation:
    build:
      targets:
        TalkHint: all
        TalkHintTests: [test]
    test:
      config: NativeValidation
      gatherCoverageData: false
      targets:
        - TalkHintTests
  TalkHint:
    build:
      targets:
        TalkHint: all
        TalkHintTests: [test]
    run:
      config: Debug
      environmentVariables:
        TALKHINT_API_BASE_URL: https://talkhint.app
    test:
      targets:
        - TalkHintTests
